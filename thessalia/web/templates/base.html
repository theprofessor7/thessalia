<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block titre %}Thessalia{% endblock %} — Thessalia</title>
<link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
</head>
<body>
<header class="barre">
  <a class="logo" href="/">Thessalia</a>
  <nav>{% block nav %}{% endblock %}</nav>
  <span class="espace"></span>
  {% if nb_a_la_main %}<a class="bouton alerte" href="/a-la-main" title="page absente du scan ou illisible">{{ nb_a_la_main }} copie{{ 's' if nb_a_la_main > 1 }} à reprendre sur le papier</a>{% endif %}
  <a class="bouton" href="/suivi">Suivi de la machine</a>
  {% block outils %}{% endblock %}
</header>
<main>{% block contenu %}{% endblock %}</main>
{% block scripts %}{% endblock %}
</body>
</html>
