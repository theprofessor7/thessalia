{% if tache and tache.etat == 'en cours' %}
<script>
// tâche en cours : jauge et étape mises à jour chaque seconde ; la page se recharge quand elle se termine
const suivre = async () => {
  const t = await (await fetch('/tache')).json();
  if (!t) return;
  const $ = id => document.getElementById(id);
  $('journal').textContent = t.journal.join('\n');
  $('etape').textContent = t.journal.length ? t.journal[t.journal.length - 1] : '';
  $('tache-etat').textContent = t.etat;
  if (t.progression) {
    $('jauge').classList.remove('indeterminee');
    $('jauge-barre').style.width = t.progression.pc + '%';
    $('jauge-pc').textContent = t.progression.pc + ' %';
    $('jauge-texte').textContent = t.progression.texte;
  }
  if (t.etat === 'en cours') { setTimeout(suivre, 1000); return; }
  try {
    sessionStorage.setItem('thessalia-fin', JSON.stringify({titre: t.titre, etat: t.etat,
      resultat: t.journal.length ? t.journal[t.journal.length - 1] : ''}));
  } catch (e) {}
  location.reload();
};
setTimeout(suivre, 1000);
</script>
{% endif %}
