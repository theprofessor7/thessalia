[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "thessalia"
version = "0.2.0"
description = "Lecture automatique de copies d'examen papier scannées (QCM, réponses courtes, code manuscrit) — ESME"
requires-python = ">=3.10"
readme = "README.md"
dependencies = [
  "opencv-python-headless>=4.8",
  "numpy>=1.24",
  "pymupdf>=1.24",
  "Pillow>=10",
]

[project.optional-dependencies]
# Niveau 2, moteurs légers (Tesseract nécessite aussi le programme tesseract installé sur le système)
ocr-light = ["pytesseract>=0.3", "rapidocr-onnxruntime>=1.3"]
# Niveau 2, moteur recommandé : TrOCR local (gratuit, le modèle est téléchargé une fois depuis Hugging Face)
trocr = ["torch>=2.1", "transformers>=4.40", "sentencepiece"]
# Générer les sujets PDF (déjà dans la stack HTML -> PDF)
sujets = ["weasyprint>=60"]
dev = ["pytest>=7"]

[project.scripts]
thessalia = "thessalia.__main__:main"

[tool.setuptools.packages.find]
include = ["thessalia*"]

[tool.setuptools.package-data]
thessalia = ["data/*.npz"]

[tool.pytest.ini_options]
testpaths = ["tests"]
